name: Build Android APK and Desktop TUI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android Licenses & Build Debug APK
        working-directory: ./android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatBackup-Agent-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller

      - name: Verify modules
        run: |
          python -c "from desktop.core.wechat_crypto import compute_wechat_key; print('Test key:', compute_wechat_key('test', '123'))"

      - name: Package Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --name "ChatBackup-TUI" --collect-all textual --collect-all rich desktop/main.py

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatBackup-Windows-Desktop
          path: dist/ChatBackup-TUI
          if-no-files-found: warn
